# Dependabot opens a pull request when a package has an update, and at once
# when it has a security fix. The CI then tests the update before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One pull request for all small updates, instead of one per package
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions that must move together with something else, by hand:
    # - @types/node follows the Node version the site runs on (22)
    # - typescript and eslint follow what Next.js supports
    #   (eslint-config-next 16 is built for ESLint 9)
    # Security fixes still come for all of them.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
