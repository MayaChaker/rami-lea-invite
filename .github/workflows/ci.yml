# Checks every pull request and every push to main, so a mistake is caught
# before it reaches the live site. Next.js 16 no longer runs ESLint during
# `next build`, so lint runs here on its own.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Exactly the versions in package-lock.json
      - run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      # The build needs no secrets: the database and the dashboard password
      # are only read when a page is visited.
      - name: Build
        run: npm run build
